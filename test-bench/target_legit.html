<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Global University — Student & Faculty Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
    }
    .login-box {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 380px;
    }
    h2 { font-size: 20px; margin-bottom: 8px; color: #0f172a; }
    p { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-top: 20px;
      display: inline-block;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Global University</h2>
    <p>Sign in to your university student account</p>
    
    <!-- Same-origin form submission (Standard Legitimate Behavior) -->
    <form action="/login" method="POST">
      <div class="form-group">
        <label for="username">Institutional ID / Email</label>
        <input type="text" id="username" name="username" placeholder="student@university.edu" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Log In to Portal</button>
    </form>

    <div class="badge">TEST BENCH TARGET: BENIGN ORIGIN</div>
  </div>
</body>
</html>
